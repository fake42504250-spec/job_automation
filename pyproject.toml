[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "job-automation"
version = "0.1.0"
description = "Local-first job discovery and recruiter email outreach automation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "apscheduler>=3.10,<4",
  "beautifulsoup4>=4.12,<5",
  "fastapi>=0.115,<1",
  "google-api-python-client>=2.140,<3",
  "google-auth-httplib2>=0.2,<1",
  "google-auth-oauthlib>=1.2,<2",
  "httpx[socks]>=0.27,<1",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6.0,<7",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.2,<9", "pytest-cov>=5,<6", "ruff>=0.6,<1"]

[project.scripts]
job-automation = "job_automation.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/job_automation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
